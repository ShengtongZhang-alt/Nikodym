# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4 (mathlib-initiative format) with the Palomar registry additions
# (responsible maintainers, classification, sources with relationships).
version: "v0.4"

project:
  name: "The sharp finite-field Nikodym exponent"
  description: >-
    A complete Lean 4 / Mathlib formalization of the sharp power saving in the
    finite-field Nikodym problem. A set N in F_q^d is a Nikodym set if through
    every point x there is a line all of whose points other than x lie in N.
    Lower bound: for every finite field F_q, every d >= 2 and every Nikodym set
    N in F_q^d, |N| >= q^d - (8 d^2 + 1) q^(d - 2^(1-d)); the proof goes through
    a carrier theorem for integral projective varieties containing many affine
    lines with private points, proved by finite-grid Hermite interpolation,
    Hilbert-function estimates (normalized monotonicity and a degree upper bound
    via linear Noether normalization), an interpolation cut, and a dimension
    induction that halves the saving at each step. Upper bound: for every d >= 2
    and epsilon > 0 and all sufficiently large primes q there is a Nikodym set
    N in F_q^d with |N| <= q^d - q^(d - 2^(1-d) - epsilon), constructed as the
    complement of a product set built from a totally real multiquadratic order
    in which q splits completely, with a digit encoding and tangent lines.
    Together these give Nik(d, q) = q^d - q^(d - 2^(1-d) + o(1)) along primes.
    Previously, for general q and d >= 3, the best lower bound was
    q^d / 2^(d-1) + O(q^(d-1)) and even Nik(d,q) = (1 - o(1)) q^d was open
    (Lund-Saraf-Wolf, Conjecture 2), while the best upper bounds for prime q
    were q^d - Omega_d(q^(d - eps_d)) with eps_d << 1/log log d and
    q^3 - Omega(q^2.1167) (Hunter-Pohoata-Verstraete-Zhang 2026); the lower
    bound here settles the former conjecture for every finite field, and the
    construction shows that the exponent d - 1/d conjectured by Chao and Yu
    (2026) is not sharp over prime fields. The README gives theorem-level
    comparisons and references. All three headline theorems are proved with no
    sorry and depend only on propext, Classical.choice and Quot.sound.
  authors:
    - "Ting-Wei Chao"
    - "Zach Hunter"
    - "Cosmin Pohoata"
    - "Hung-Hsun Hans Yu"
    - "Shengtong Zhang"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Shengtong Zhang"

# `repository` is omitted: this repository is the substantive proof development,
# not a thin Comparator wrapper.

classification:
  arxiv: [math.CO, math.AG]
  msc2020: ["05B25", "11T06", "13D40", "14G15"]

sources:
  - title: "Nikodym sets: a power saving from finite-grid interpolation"
    authors:
      - "Ting-Wei Chao"
      - "Zach Hunter"
      - "Cosmin Pohoata"
      - "Hung-Hsun Hans Yu"
      - "Shengtong Zhang"
    id: "docs/Nikodym_sharp_power_saving.tex (this repository, at the submitted commit)"
    type: paper
    location: "https://github.com/ShengtongZhang-alt/Nikodym/blob/main/docs/Nikodym_sharp_power_saving.tex"
    relationship: formalizes
    note: >-
      Unpublished research note dated 5 September 2026, included in the
      repository as docs/Nikodym_sharp_power_saving.tex (with a compiled PDF).
      The writeup is preliminary and partially AI-generated; a detailed
      human-readable exposition is in preparation. The formalization proves Theorem 1 (carrier theorem) and Corollary 2
      (the lower bound |F_q^d \ N| <= (8 d^2 + 1) q^(d - 2^(1-d)) for every
      prime power q). The commutative-algebra inputs the note takes as
      standard (Hilbert-function bounds, linear Noether normalization, degree
      of a proper hypersurface section) are proved from Mathlib in the
      Nikodym/LowerBound/Algebra directory following
      docs/algebra_backend_design.md.
    license: unknown
    author_endorsement: participated
  - title: "A prime-uniform construction of small finite-field Nikodym sets"
    authors:
      - "Ting-Wei Chao"
      - "Zach Hunter"
      - "Cosmin Pohoata"
      - "Hung-Hsun Hans Yu"
      - "Shengtong Zhang"
    id: "docs/nikodym_construction.tex (this repository, at the submitted commit)"
    type: paper
    location: "https://github.com/ShengtongZhang-alt/Nikodym/blob/main/docs/nikodym_construction.tex"
    relationship: formalizes
    note: >-
      Unpublished research note included in the repository as
      docs/nikodym_construction.tex (with a compiled PDF). The writeup is
      preliminary and partially AI-generated; a detailed human-readable
      exposition is in preparation. The formalization
      proves Corollary 1.2 (the prime-uniform bound |S| <= q^h - q^(h - 2^(1-h)
      - epsilon) for all sufficiently large primes q). The fixed-field Theorem
      1.1 is formalized through an abstract "scaffold" interface (a rank-d free
      Z-algebra with jointly injective real embeddings) instantiated by
      multiquadratic orders Z[sqrt r_1, ..., sqrt r_m]; the general totally real
      number field statement of Theorem 1.1 is not formalized separately, and
      the hypersurface variant (Theorem 1.3 and later sections) is out of scope.
    license: unknown
    author_endorsement: participated
  - title: "Finite field Kakeya and Nikodym sets in three dimensions"
    authors: ["Ben Lund", "Shubhangi Saraf", "Charles Wolf"]
    id: "doi:10.1137/17M1146099"
    type: paper
    location: "https://doi.org/10.1137/17M1146099"
    relationship: background
    note: >-
      SIAM J. Discrete Math. 32 (2018), 2836-2849; arXiv:1609.01048. Prior
      lower bound Nik(3,q) >= (0.38 - o(1)) q^3 (Theorem 3), the conjecture
      Nik(d,q) >= (1 - o(1)) q^d (Conjecture 2), which the formalized lower
      bound settles for every finite field, and the two-dimensional bound
      Nik(2,q) >= q^2 - q^(3/2) - 1 (Theorem 26). See README.md, "Comparison
      with prior work".
  - title: "Finite field Nikodym problem for spread line sets"
    authors: ["Ting-Wei Chao", "Hung-Hsun Hans Yu"]
    id: "arXiv:2601.20851"
    type: paper
    location: "https://arxiv.org/abs/2601.20851"
    relationship: background
    note: >-
      Conjecture 1.1 proposes Nik(d,q) >= q^d - C_d q^(d - 1/d) for d >= 3 and
      Theorem 1.2 proves it for algebraically spread line sets. The formalized
      construction shows that over prime fields the sharp exponent is
      d - 2^(1-d), which exceeds d - 1/d for d >= 3, so the conjectured exponent
      is not the truth for prime q.
  - title: "New Nikodym set constructions over finite fields"
    authors: ["Terence Tao"]
    id: "arXiv:2511.07721"
    type: paper
    location: "https://arxiv.org/abs/2511.07721"
    relationship: background
    note: >-
      Prior upper bound for d >= 3 and odd prime powers q (new when q is not a
      perfect square): Nik(d,q) <= q^d - ((d-2)/log 2 + 1 + o(1)) q^(d-1) log q,
      a constant-factor improvement of the random construction
      q^d - (d-1+o(1)) q^(d-1) log q; also the product construction and the deduction of the
      general lower bound Nik(d,q) >= q^d / 2^(d-1) + O(q^(d-1)) from the
      Kakeya bound.
  - title: "Large point-line matchings and small Nikodym sets"
    authors: ["Zach Hunter", "Cosmin Pohoata", "Jacques Verstraete", "Shengtong Zhang"]
    id: "arXiv:2601.19879"
    type: paper
    location: "https://arxiv.org/abs/2601.19879"
    relationship: background
    note: >-
      Best prior upper bounds for prime q: Nik(3,q) <= q^3 - Omega(q^2.1167)
      and Nik(d,q) <= q^d - Omega_d(q^(d - eps_d)) with eps_d << 1/log log d
      (Theorem 1.10), and Nik(2,q) <= q^2 - q^(1+c) (Theorem 1.11). The
      formalized construction improves these to q^d - q^(d - 2^(1-d) - eps) for
      every d >= 2.
  - title: "New affine-invariant codes from lifting"
    authors: ["Alan Guo", "Swastik Kopparty", "Madhu Sudan"]
    id: "doi:10.1145/2422436.2422494"
    type: paper
    location: "https://doi.org/10.1145/2422436.2422494"
    relationship: background
    note: >-
      ITCS 2013. Lower bound Nik(d,q) >= q^d - O(q^((1-eps)d)) in bounded
      characteristic; the formalized lower bound has no restriction on the
      characteristic.
  - title: "Some inequalities in functional analysis, combinatorics, and probability theory"
    authors: ["Chunrong Feng", "Liangpan Li", "Jian Shen"]
    id: "doi:10.37236/330"
    type: paper
    location: "https://doi.org/10.37236/330"
    relationship: background
    note: "Electron. J. Combin. 17 (2010), R58. Two-dimensional lower bound Nik(2,q) >= q^2 - q^(3/2) - q."
  - title: "On the size of Kakeya sets in finite fields"
    authors: ["Zeev Dvir"]
    id: "doi:10.1090/S0894-0347-08-00607-3"
    type: paper
    location: "https://doi.org/10.1090/S0894-0347-08-00607-3"
    relationship: background
    note: "J. Amer. Math. Soc. 22 (2009), 1093-1097. The polynomial method giving the previous general lower bound Nik(d,q) >= c_d q^d."
  - title: "Sharp density bounds on the finite field Kakeya problem"
    authors: ["Boris Bukh", "Ting-Wei Chao"]
    id: "doi:10.19086/da.30707"
    type: paper
    location: "https://doi.org/10.19086/da.30707"
    relationship: background
    note: "Discrete Analysis 2021:26. Sharp Kakeya density 1/2^(d-1), which gives the previous general Nikodym lower bound q^d / 2^(d-1) + O(q^(d-1))."
  - title: "Nikodym set"
    id: "https://en.wikipedia.org/wiki/Nikodym_set"
    type: "web discussion"
    location: "https://en.wikipedia.org/wiki/Nikodym_set"
    relationship: background
    note: "Background on the classical and finite-field Nikodym problems."
  - title: "Formal Conjectures (Google DeepMind): finite-field Kakeya conjecture"
    id: "https://github.com/google-deepmind/formal-conjectures"
    type: other
    location: "https://github.com/google-deepmind/formal-conjectures"
    relationship: background
    note: >-
      The Lean definition Nikodym.IsNikodym follows the style of the
      IsKakeyaFinite definition in the Formal Conjectures repository (sets are
      Finsets of Fin n -> F, lines are parametrised as x + t * v with v != 0).
      No code is imported from it.

# We are not aware of a previous Lean formalization of a finite-field Nikodym
# bound (the Formal Conjectures repository cited above states the finite-field
# Kakeya problem, not Nikodym); left empty deliberately.
related_formalizations: []

status:
  scope: >-
    Fully formalized: (1) the lower bound |N| >= q^d - (8 d^2 + 1) q^(d - 2^(1-d))
    for every finite field F_q (any characteristic, q any prime power), every
    d >= 2 and every Nikodym set N in F_q^d, in both a denominator-free
    natural-number form (Nikodym.card_compl_pow_mul_card_le) and the displayed
    real form with real exponents (Nikodym.card_ge_pow_sub); (2) the upper
    bound: for every d >= 2 and epsilon > 0 there is q_0 such that every finite
    field of prime cardinality q >= q_0 contains a Nikodym set of size at most
    q^d - q^(d - 2^(1-d) - epsilon) (Nikodym.exists_isNikodym_card_le). Not
    formalized: the intermediate carrier theorem is stated in the internal form
    of the blueprint (natural-number inequalities over an explicit algebraic
    interface) rather than in the projective-variety language of the note; the
    construction note's fixed-field Theorem 1.1 for a general totally real
    number field and its hypersurface variants are not stated separately, only
    the prime-uniform corollary is. The threshold q_0 in the upper bound is
    existential and not made explicit.
  sorry_count: 0
  sorry_in_definitions: 0
  # Every axiom appearing in `#print axioms` for the main results (the three
  # standard Lean/Mathlib axioms and nothing else; checked by
  # scripts/check-axioms.rb and by Comparator's `permitted_axioms`).
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "Nikodym.card_compl_pow_mul_card_le"
      file: "Nikodym/Main.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
    - declaration: "Nikodym.card_ge_pow_sub"
      file: "Nikodym/Main.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
    - declaration: "Nikodym.exists_isNikodym_card_le"
      file: "Nikodym/Main.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"

automation:
  methods:
    - method: agent
      models: ["Claude Fable 5.1 (Anthropic)", "Grok 4.6 (xAI)"]
      framework: "Cursor"
      tool_setup: >-
        AI-assisted. A Claude Fable 5.1 agent running in the Cursor IDE wrote
        the statement-level blueprints (docs/*_lean_blueprint.md,
        docs/algebra_backend_design.md) under human direction and orchestrated
        parallel subagents that proved the blueprint nodes as separate Lean
        modules. Of 44 subagent tasks, 37 were run by Claude (including the
        whole commutative-algebra backend, the carrier theorem, grid/jet
        interpolation, Kummer independence, and the final assembly) and 7 by
        Grok 4.6 on routine leaf nodes (Construction/ProductCriterion, Arith,
        Parameters; MultiQuadratic/Order, Legendre, Scaffold;
        LowerBound/Arithmetic/BinomialGap, Multiplicity, WeightedSelection;
        LowerBound/Hilbert/Shadow; LowerBound/Lines/Jets, Vanishing), roughly
        12% of the Lean source. Each node was checked by `lake build` and the
        axiom report before being marked done in docs/PROGRESS.md. Standard
        Lean/Mathlib tactics were used; no proof-search tools external to Lean
        and Mathlib.
      cost:
        wall_time: "Approximately one day of elapsed agent time (all commits are dated 2026-09-05)."
        spend_usd: "not tracked"
        hardware: "Local Apple Silicon Mac for Lean builds; API-hosted models."
      prompting_notes: >-
        The human author supplied the two source notes and the target theorem
        statements, reviewed the blueprints, and directed the decomposition into
        nodes. Agents were prompted node by node with the blueprint statement,
        the mathematical proof from the note, and the interfaces of already
        completed nodes, and were required to leave the build free of sorry
        and linter warnings.
  spend_usd: "not tracked"
  notes: >-
    Human-directed, agent-executed workflow. The human author (a coauthor of the
    source notes) fixed the Lean statements in Nikodym/Definition.lean and
    Nikodym/Main.lean, wrote or approved the blueprints, and reviewed the final
    statements; AI agents produced essentially all of the ~15,000 lines of proof
    code. Correctness of proofs rests on the Lean kernel; the statements in
    Challenge.lean are the human-audited surface. Separately from the
    formalization, GPT 5.6 and GPT 6 Astra were used in the ideation of the
    mathematics recorded in the source notes (see README.md).

fidelity:
  divergences: >-
    None known in the headline statements. Presentation differences: the notes
    state the lower bound for the complement, |F_q^d \ N| <= (8 d^2 + 1)
    q^(d - 2^(1-d)); the Lean statements give the equivalent bound on |N| and,
    separately, the equivalent natural-number form obtained by raising to the
    power 2^(d-1). Real exponents use Mathlib's Real.rpow. The construction is
    stated only for prime q (as in the note's prime-uniform corollary); the
    lower bound holds for every finite field with no restriction on the
    characteristic (as in the note). The set produced by the construction is
    only asserted to exist; its explicit description is internal to the proof.

review:
  status: "self-assessed"
  reviewers:
    - "Shengtong Zhang"
  notes: >-
    The three compared statements and the definition Nikodym.IsNikodym were
    audited by the human author against the source notes (see
    FORMALIZATION.md for the correspondence). Every proof is machine-checked by
    Lean; `#print axioms` for each headline theorem reports exactly propext,
    Classical.choice and Quot.sound. No independent third-party review of the
    formalization has been performed.

alignment:
  namespace: "Nikodym"
  statements:
    - source: "Nikodym_sharp_power_saving.tex, Corollary 2 (label cor:nikodym), natural-number form"
      lean: "Nikodym.card_compl_pow_mul_card_le"
      module: "Nikodym.Main"
      status: proved
      note: >-
        (q^d - |N|)^(2^(d-1)) * q <= (8 d^2 + 1)^(2^(d-1)) * q^(d 2^(d-1)) in
        ℕ; equivalent to the displayed bound after taking 2^(d-1)-th roots.
    - source: "Nikodym_sharp_power_saving.tex, Corollary 2 (label cor:nikodym), displayed form"
      lean: "Nikodym.card_ge_pow_sub"
      module: "Nikodym.Main"
      status: proved
      note: "q^d - (8 d^2 + 1) q^(d - 2^(1-d)) <= |N| as an inequality in ℝ with real powers."
    - source: "nikodym_construction.tex, Corollary 1.2 (label cor:uniform)"
      lean: "Nikodym.exists_isNikodym_card_le"
      module: "Nikodym.Main"
      status: proved
      note: >-
        For d >= 2 and epsilon > 0 there is q_0 such that every finite field of
        prime cardinality q >= q_0 has a Nikodym set of size at most
        q^d - q^(d - 2^(1-d) - epsilon).

acknowledgements: >-
  Mathlib and the Lean 4 community; the Formal Conjectures project for the
  finite-field Kakeya definition style; the Palomar template for the
  Comparator and CI layout.
